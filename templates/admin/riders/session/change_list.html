{% extends "admin/change_list.html" %}
{% block content %}
  <p>Build sessions from orders on the map, then choose a rider to receive a timed offer. <a href="{% url 'dispatch-session-planner' %}">Open session map</a>.</p>
  {% for session in cl.result_list %}
    <form id="session-row-{{ session.pk }}" method="post" action="{% url 'admin:riders_session_update_row' session.pk %}">
      {% csrf_token %}
    </form>
  {% endfor %}
  {{ block.super }}
{% endblock %}
