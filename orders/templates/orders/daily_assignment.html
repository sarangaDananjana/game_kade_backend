<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Orders Assignment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #map {
            height: 90vh;
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .sidebar {
            height: 90vh;
            overflow-y: auto;
        }
    </style>
</head>
<body class="bg-light">

<div class="container-fluid mt-4">
    <div class="row">
        <!-- Sidebar for Controls -->
        <div class="col-md-4 sidebar">
            <h3 class="mb-4">Daily Orders Assignment</h3>
            
            <!-- Today's Summary -->
            <div class="card mb-4 shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Today's Summary</h5>
                </div>
                <div class="card-body p-0">
                    <table class="table table-striped table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Product Name</th>
                                <th>Total Ordered</th>
                            </tr>
                        </thead>
                        <tbody id="summaryTableBody">
                            <tr><td colspan="2" class="text-center">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Assign to Rider -->
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">Assign Selected Orders</h5>
                </div>
                <div class="card-body">
                    <p class="text-muted small mb-2">Draw a polygon on the map to select orders, then choose a rider below to assign them.</p>
                    
                    <div class="mb-3">
                        <label for="riderSelect" class="form-label fw-bold">Select Rider:</label>
                        <select class="form-select" id="riderSelect">
                            <option value="">-- Choose a Rider --</option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span>Selected Orders: <strong id="selectedCount" class="text-primary">0</strong></span>
                    </div>

                    <button class="btn btn-success w-100" id="assignBtn" disabled>Assign Orders</button>
                    <button class="btn btn-secondary w-100 mt-2" id="clearSelectionBtn" style="display: none;">Clear Selection</button>
                </div>
            </div>
            
            <!-- Loading Indicator -->
            <div id="actionLoading" class="text-center mt-3" style="display: none;">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">Processing...</p>
            </div>
            
            <div id="alertPlaceholder" class="mt-3"></div>
        </div>

        <!-- Map Container -->
        <div class="col-md-8">
            <div id="map"></div>
        </div>
    </div>
</div>

<script>
    let map;
    let drawingManager;
    let currentDrawing = null;
    let orderMarkers = [];
    let selectedOrderIds = [];

    // Initialize Map
    function initMap() {
        // Center of Sri Lanka or default Shop location
        const shopLocation = { lat: 5.938075, lng: 80.581056 };
        
        map = new google.maps.Map(document.getElementById("map"), {
            center: shopLocation,
            zoom: 14,
        });

        // Add shop marker
        new google.maps.Marker({
            position: shopLocation,
            map: map,
            title: "ගමේ කඩේ (Shop)",
            icon: {
                url: "https://maps.google.com/mapfiles/ms/icons/store-locator.png",
                scaledSize: new google.maps.Size(32, 32)
            }
        });

        drawingManager = new google.maps.drawing.DrawingManager({
            drawingMode: null,
            drawingControl: true,
            drawingControlOptions: {
                position: google.maps.ControlPosition.TOP_CENTER,
                drawingModes: [google.maps.drawing.OverlayType.POLYGON],
            },
            polygonOptions: {
                fillColor: "#0d6efd",
                fillOpacity: 0.3,
                strokeWeight: 2,
                clickable: false,
                editable: true,
                zIndex: 1,
            },
        });

        drawingManager.setMap(map);

        google.maps.event.addListener(drawingManager, 'polygoncomplete', function (polygon) {
            if (currentDrawing) {
                currentDrawing.setMap(null);
            }
            currentDrawing = polygon;
            drawingManager.setDrawingMode(null);
            
            // Re-calculate when user edits the polygon
            polygon.getPaths().forEach(function(path, index){
                google.maps.event.addListener(path, 'insert_at', function(){ calculateSelection(); });
                google.maps.event.addListener(path, 'remove_at', function(){ calculateSelection(); });
                google.maps.event.addListener(path, 'set_at', function(){ calculateSelection(); });
            });

            calculateSelection();
            document.getElementById('clearSelectionBtn').style.display = 'block';
        });

        // Load Initial Data
        fetchSummary();
        fetchRiders();
        fetchUnassignedOrders();
    }

    function calculateSelection() {
        if (!currentDrawing) return;
        
        selectedOrderIds = [];
        
        orderMarkers.forEach(markerObj => {
            const isInside = google.maps.geometry.poly.containsLocation(markerObj.marker.getPosition(), currentDrawing);
            if (isInside) {
                selectedOrderIds.push(markerObj.id);
                // Highlight marker
                markerObj.marker.setIcon('https://maps.google.com/mapfiles/ms/icons/blue-dot.png');
            } else {
                // Reset marker
                markerObj.marker.setIcon('https://maps.google.com/mapfiles/ms/icons/red-dot.png');
            }
        });

        const countEl = document.getElementById('selectedCount');
        countEl.innerText = selectedOrderIds.length;
        
        const assignBtn = document.getElementById('assignBtn');
        if (selectedOrderIds.length > 0 && document.getElementById('riderSelect').value) {
            assignBtn.disabled = false;
        } else {
            assignBtn.disabled = true;
        }
    }

    document.getElementById('riderSelect').addEventListener('change', function() {
        const assignBtn = document.getElementById('assignBtn');
        if (selectedOrderIds.length > 0 && this.value) {
            assignBtn.disabled = false;
        } else {
            assignBtn.disabled = true;
        }
    });

    document.getElementById('clearSelectionBtn').addEventListener('click', function() {
        if (currentDrawing) {
            currentDrawing.setMap(null);
            currentDrawing = null;
        }
        selectedOrderIds = [];
        document.getElementById('selectedCount').innerText = '0';
        document.getElementById('assignBtn').disabled = true;
        this.style.display = 'none';
        
        // Reset all markers
        orderMarkers.forEach(markerObj => {
            markerObj.marker.setIcon('https://maps.google.com/mapfiles/ms/icons/red-dot.png');
        });
    });

    document.getElementById('assignBtn').addEventListener('click', async function() {
        const riderId = document.getElementById('riderSelect').value;
        if (!riderId || selectedOrderIds.length === 0) return;

        this.disabled = true;
        document.getElementById('actionLoading').style.display = 'block';

        try {
            const response = await fetch('/api/orders/bulk-assign/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    rider_id: riderId,
                    order_ids: selectedOrderIds
                })
            });

            if (response.ok) {
                showAlert('Orders assigned successfully!', 'success');
                document.getElementById('clearSelectionBtn').click();
                fetchUnassignedOrders(); // Refresh map markers
            } else {
                const data = await response.json();
                showAlert('Failed to assign: ' + (data.error || 'Unknown error'), 'danger');
            }
        } catch (error) {
            showAlert('Error: ' + error, 'danger');
        } finally {
            document.getElementById('actionLoading').style.display = 'none';
            if (selectedOrderIds.length > 0 && document.getElementById('riderSelect').value) {
                this.disabled = false;
            }
        }
    });

    async function fetchSummary() {
        try {
            const response = await fetch('/api/orders/daily-summary/');
            const data = await response.json();
            
            const tbody = document.getElementById('summaryTableBody');
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="2" class="text-center text-muted">No orders for today yet.</td></tr>';
                return;
            }

            let totalItems = 0;
            data.forEach(item => {
                totalItems += item.total_quantity;
                tbody.innerHTML += `
                    <tr>
                        <td>${item.product_name}</td>
                        <td class="fw-bold">${item.total_quantity}</td>
                    </tr>
                `;
            });
            
            // Add a total row
            tbody.innerHTML += `
                <tr class="table-light fw-bold">
                    <td>Total Products</td>
                    <td>${totalItems}</td>
                </tr>
            `;
        } catch (error) {
            console.error('Error fetching summary:', error);
            document.getElementById('summaryTableBody').innerHTML = '<tr><td colspan="2" class="text-center text-danger">Error loading summary.</td></tr>';
        }
    }

    async function fetchRiders() {
        try {
            const response = await fetch('/api/orders/riders/');
            const riders = await response.json();
            
            const select = document.getElementById('riderSelect');
            riders.forEach(rider => {
                const option = document.createElement('option');
                option.value = rider.id;
                option.text = `${rider.name || 'Unnamed Rider'} (${rider.phone_number})`;
                select.appendChild(option);
            });
        } catch (error) {
            console.error('Error fetching riders:', error);
            showAlert('Failed to load riders list.', 'danger');
        }
    }

    async function fetchUnassignedOrders() {
        try {
            const response = await fetch('/api/orders/today-unassigned/');
            const orders = await response.json();
            
            // Clear existing markers
            orderMarkers.forEach(m => m.marker.setMap(null));
            orderMarkers = [];
            
            if (orders.length === 0) {
                // No orders to show
                return;
            }

            console.log("Unassigned orders loaded:", orders);

            orders.forEach(order => {
                const pos = { lat: Number(order.lat), lng: Number(order.lng) };
                const marker = new google.maps.Marker({
                    position: pos,
                    map: map,
                    title: `Order #${order.id} - ${order.status}`,
                    icon: 'https://maps.google.com/mapfiles/ms/icons/red-dot.png'
                });
                
                const infoWindow = new google.maps.InfoWindow({
                    content: `<div><strong>Order #${order.id}</strong><br>Status: ${order.status}<br>Total: Rs. ${order.total_amount}</div>`
                });

                marker.addListener('click', () => {
                    infoWindow.open(map, marker);
                });

                orderMarkers.push({
                    id: order.id,
                    marker: marker
                });
            });

        } catch (error) {
            console.error('Error fetching orders:', error);
            showAlert('Failed to load unassigned orders.', 'danger');
        }
    }

    function showAlert(message, type) {
        const wrapper = document.createElement('div');
        wrapper.innerHTML = [
            `<div class="alert alert-${type} alert-dismissible" role="alert">`,
            `   <div>${message}</div>`,
            '   <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>',
            '</div>'
        ].join('');
        document.getElementById('alertPlaceholder').append(wrapper);
        
        // Auto dismiss after 5 seconds
        setTimeout(() => {
            const alertNode = wrapper.querySelector('.alert');
            if (alertNode) {
                const alert = new bootstrap.Alert(alertNode);
                alert.close();
            }
        }, 5000);
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- We pass the dynamic API key from Django context -->
<script async defer src="https://maps.googleapis.com/maps/api/js?key={{ google_maps_api_key }}&libraries=drawing,geometry&callback=initMap"></script>
</body>
</html>
